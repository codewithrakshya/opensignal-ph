name: Supply-chain report

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: opensignal-ph.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: software-bill-of-materials
          path: opensignal-ph.spdx.json
