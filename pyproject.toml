[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opensignal-ph"
version = "0.1.0"
description = "A reproducible public-health safety surveillance platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
opensignal = "opensignal.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]
data = [
  "duckdb>=1.2,<2",
  "polars>=1.21,<2",
  "pyarrow>=19,<20",
]
ml = [
  "scikit-learn>=1.6,<2",
]
ai = [
  "openai>=2.23,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opensignal"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["opensignal"]
